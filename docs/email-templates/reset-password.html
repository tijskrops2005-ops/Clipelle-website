<!-- Supabase → Authentication → Emails → Templates → "Reset Password".
     Subject: Choose a new password for Clipelle -->
<div style="margin:0;padding:32px 16px;background:#FAFAF7;font-family:Helvetica,Arial,sans-serif;color:#111114">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border:1px solid #ECEAE4;border-radius:20px;padding:32px">
    <img src="https://www.clipelle.com/brand/clipelle-logo-dark-600.png" alt="Clipelle" width="140" style="display:block;width:140px;height:auto;margin:0 0 28px" />
    <h1 style="margin:0 0 8px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-0.02em">Choose a new password</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#6B6B70">Someone asked to reset the password of your Clipelle account. The link works once.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 24px;background:#D43F1B;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;border-radius:999px">Choose a new password</a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6B6B70">Did not ask for this? Then you can ignore this e-mail; your password stays the same.</p>
  </div>
  <p style="max-width:480px;margin:16px auto 0;font-size:12px;line-height:1.6;color:#6B6B70;text-align:center">Clipelle · video ads from one product photo</p>
</div>
